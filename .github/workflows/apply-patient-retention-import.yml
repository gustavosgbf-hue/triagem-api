name: Wire patient retention preload
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-patient-retention-import.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch existing preload
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web-push-preload.js')
          s=p.read_text()
          marker="import './patient-retention-preload.js';"
          if marker not in s:
              s=marker+'\n'+s
              p.write_text(s)
          print('retention imported by web-push preload')
          PY
      - name: Validate syntax
        run: |
          node --check patient-retention-preload.js
          node --check web-push-preload.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-push-preload.js
          if ! git diff --cached --quiet; then git commit -m 'Load patient retention from web push preload'; git push; fi
