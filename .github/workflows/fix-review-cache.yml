name: Fix review response cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-review-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch review cache headers
        run: node scripts/fix-review-cache.mjs
      - name: Syntax check
        run: node --check mobile-beta-test-preload.js
      - name: Commit backend fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-beta-test-preload.js
          git commit -m "Disable caching in review consultation status" || exit 0
          git push
