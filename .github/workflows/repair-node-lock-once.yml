name: Repair backend npm lock once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-node-lock-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Rebuild lock from package.json
        run: |
          rm -rf node_modules
          npm install --package-lock-only
          npm ci
      - name: Validate runtime dependencies and files
        run: |
          node -e "Promise.all([import('express'),import('web-push'),import('pg'),import('jsonwebtoken')]).then(()=>console.log('runtime deps ok'))"
          node --check mobile-otp-preload.js
          node --check web-push-preload.js
          node --check patient-retention-preload.js
          node -e "const p=require('./package-lock.json'); for (const k of ['node_modules/express','node_modules/web-push','node_modules/pg','node_modules/jsonwebtoken']) { if(!p.packages[k]) throw new Error('missing '+k) } console.log('lock deps ok')"
      - name: Commit repaired lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then git commit -m 'Repair backend npm lock'; git push; else echo 'package-lock already consistent'; fi
