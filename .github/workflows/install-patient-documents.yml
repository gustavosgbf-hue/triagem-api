name: Install patient documents history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-patient-documents.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Memed filenames and patient documents API
        shell: python
        run: |
          from pathlib import Path

          memed = Path('memed-chat-preload.js')
          text = memed.read_text(encoding='utf-8')

          if 'Documento_Medico_${partes.day}' not in text:
              text = text.replace(
                  "      const arquivoNome = `Receita_Memed_${safePrescriptionId}.pdf`;\n",
                  """      const agora = new Date();
      const partes = new Intl.DateTimeFormat('pt-BR', {
        timeZone: 'America/Fortaleza',
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hour12: false,
      }).formatToParts(agora).reduce((acc, p) => ({ ...acc, [p.type]: p.value }), {});
      const arquivoNome = `Documento_Medico_${partes.day}-${partes.month}-${partes.year}_${partes.hour}-${partes.minute}-${partes.second}.pdf`;
""",
                  1,
              )

              text = text.replace(
                  "          WHERE atendimento_id=$1 AND autor='medico' AND arquivo_nome=$2\n",
                  """          WHERE atendimento_id=$1
            AND autor='medico'
            AND arquivo_tipo='pdf'
            AND arquivo_url LIKE '%/chat/memed/%'
            AND arquivo_url LIKE $2
""",
                  1,
              )
              text = text.replace(
                  "        [atendimentoId, arquivoNome],\n",
                  "        [atendimentoId, `%/${safePrescriptionId}-%`],\n",
                  1,
              )
              text = text.replace(
                  "        ContentType: 'application/pdf',\n",
                  "        ContentType: 'application/pdf',\n        ContentDisposition: `inline; filename=\"${arquivoNome}\"`,\n",
                  1,
              )

          if 'Documento_Medico_${partes.day}' not in text:
              raise SystemExit('Could not patch Memed filename')
          memed.write_text(text, encoding='utf-8')

          hist = Path('mobile-paciente-historico-preload.js')
          text = hist.read_text(encoding='utf-8')
          marker = "  app.get('/api/paciente/atendimento-em-andamento', authPaciente, async (req, res) => {"
          route = r'''
  app.get('/api/paciente/documentos', authPaciente, async (req, res) => {
    try {
      const paciente = await pacienteAtual(req.pacienteId);
      if (!paciente) return res.status(404).json({ ok: false, error: 'Paciente não encontrado' });

      const phone = normalizePhone(paciente.tel);
      const cpf = normalizeCpf(paciente.cpf);
      if (phone.length < 10) return res.json({ ok: true, documentos: [] });

      const result = await pool.query(
        `SELECT
           m.id,
           m.atendimento_id,
           m.arquivo_url,
           m.arquivo_tipo,
           m.arquivo_nome,
           m.criado_em,
           NULLIF(TRIM(COALESCE(to_jsonb(f)->>'medico_nome','')), '') AS profissional_nome,
           COALESCE(
             NULLIF(to_jsonb(f)->>'finalizado_em','')::timestamptz,
             NULLIF(to_jsonb(f)->>'encerrado_em','')::timestamptz,
             NULLIF(to_jsonb(f)->>'assumido_em','')::timestamptz,
             NULLIF(to_jsonb(f)->>'criado_em','')::timestamptz,
             m.criado_em
           ) AS data_atendimento
         FROM mensagens m
         JOIN fila_atendimentos f ON f.id = m.atendimento_id
        WHERE m.arquivo_url IS NOT NULL
          AND LOWER(COALESCE(m.arquivo_tipo,'')) = 'pdf'
          AND RIGHT(regexp_replace(COALESCE(to_jsonb(f)->>'tel',''), '\\D', '', 'g'), 11) = $1
          AND (
            $2 = '' OR
            regexp_replace(COALESCE(to_jsonb(f)->>'cpf',''), '\\D', '', 'g') = $2 OR
            regexp_replace(COALESCE(to_jsonb(f)->>'pagador_cpf',''), '\\D', '', 'g') = $2
          )
          AND COALESCE(to_jsonb(f)->>'status','') NOT IN ('cancelado','expirado')
        ORDER BY m.criado_em DESC, m.id DESC
        LIMIT 100`,
        [phone, cpf],
      );

      const documentos = result.rows.map((row) => ({
        id: row.id,
        atendimento_id: row.atendimento_id,
        arquivo_url: row.arquivo_url,
        arquivo_tipo: row.arquivo_tipo || 'pdf',
        arquivo_nome: row.arquivo_nome || 'Documento médico.pdf',
        profissional_nome: row.profissional_nome || 'Profissional da ConsultaJá24h',
        medico_nome: row.profissional_nome || null,
        criado_em: row.criado_em,
        data_atendimento: row.data_atendimento,
      }));

      return res.json({ ok: true, documentos });
    } catch (error) {
      console.error('[PACIENTE-DOCUMENTOS]', error);
      return res.status(500).json({ ok: false, error: 'Não foi possível carregar seus documentos agora.' });
    }
  });

'''
          if '/api/paciente/documentos' not in text:
              if marker not in text: raise SystemExit('Patient history insertion point not found')
              text = text.replace(marker, route + marker, 1)
          hist.write_text(text, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memed-chat-preload.js mobile-paciente-historico-preload.js
          git commit -m "Add persistent patient documents history"
          git push origin HEAD:main
