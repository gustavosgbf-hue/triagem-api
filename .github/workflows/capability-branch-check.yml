name: Capability branch checks

on:
  pull_request:
    branches: [main]
    types: [synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/paciente-longitudinal-prontuario
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax
        run: |
          node --check atendimento-capability-preload.js
          node --check medico-paciente-longitudinal-preload.js
          node --check patient-identity-security.js
      - name: Tests
        run: npm test
      - name: Diff check
        run: git diff --check origin/main...HEAD
