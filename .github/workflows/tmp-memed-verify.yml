name: Temporary Memed verification
on:
  push:
    branches: [feature/paciente-longitudinal-prontuario]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check memed-chat-preload.js
      - run: node --check atendimento-capability-preload.js
      - run: node --check atendimento-capability-bootstrap-preload.js
      - run: npm test
      - run: git diff --check origin/main...HEAD
