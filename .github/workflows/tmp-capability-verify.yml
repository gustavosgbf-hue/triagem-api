name: Temporary capability verification

on:
  push:
    branches: [feature/paciente-longitudinal-prontuario]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax
        run: |
          node --check atendimento-capability-preload.js
          node --check atendimento-capability-bootstrap-preload.js
          node --check medico-paciente-longitudinal-preload.js
          node --check memed-chat-preload.js
          node --check patient-identity-security.js
      - name: Tests
        run: npm test
      - name: Diff check
        run: git diff --check origin/main...HEAD
